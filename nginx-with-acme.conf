# Nginx 配置 - 支援 Win-ACME 自動更新憑證

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 上游 Waitress 伺服器
    upstream waitress_backend {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    # HTTP Server - 重定向到 HTTPS
    server {
        listen       80;
        server_name  devzoneapi1.aurocore.com;

        # Win-ACME 驗證路徑（重要！）
        location /.well-known/acme-challenge/ {
            root C:/nginx/html;
            try_files $uri =404;
        }

        # 其他請求重定向到 HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen       443 ssl http2;
        server_name  devzoneapi1.aurocore.com;

        # SSL 憑證（Win-ACME 會自動更新這些檔案）
        ssl_certificate      C:/Users/Administrator/AppData/Roaming/letsencrypt-win-simple/httpsacme-v02.api.letsencrypt.org/devzoneapi1.aurocore.com-chain.pem;
        ssl_certificate_key  C:/Users/Administrator/AppData/Roaming/letsencrypt-win-simple/httpsacme-v02.api.letsencrypt.org/devzoneapi1.aurocore.com-key.pem;

        # SSL 設定
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        # 日誌
        access_log  logs/access.log;
        error_log   logs/error.log;

        # 關鍵：禁用緩衝（對 SSE 很重要）
        proxy_buffering off;
        proxy_cache off;
        
        # SSE 專用設定
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # HTTP/1.1 支援
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 轉發 Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Win-ACME 驗證路徑（HTTPS 也需要）
        location /.well-known/acme-challenge/ {
            root C:/nginx/html;
            try_files $uri =404;
        }

        # 所有請求轉發到 Waitress
        location / {
            proxy_pass http://waitress_backend;
            
            # SSE 特殊處理
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
            
            # 禁用壓縮
            gzip off;
            proxy_set_header Accept-Encoding "";
        }
        
        # Chat 端點（SSE 串流）- 額外優化
        location /chat/ {
            proxy_pass http://waitress_backend;
            
            # 關鍵：完全禁用緩衝
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            
            # SSE Headers
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
            
            # 禁用壓縮
            gzip off;
            proxy_set_header Accept-Encoding "";
            
            # 添加 SSE Headers
            add_header Cache-Control 'no-cache';
            add_header X-Accel-Buffering 'no';
        }
    }
}
