<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traitty Widget Demo (Production)</title>
    <!-- 引入 Styles -->
    <link rel="stylesheet" href="https://devzoneapi3.aurocore.com/loader.css">
</head>

<body>
    <!-- Widget Configuration -->
    <script>
        window.TRAITTY_WIDGET_CONFIG = {
            userEmail: "eva@wepredict.io",
            apiBaseUrl: "https://devzoneapi1.aurocore.com/api/v2",
            autoInit: true
        };

    <!-- Mount Point -->
    <div id="app"></div>

       請根據 dist 資料夾內的實際檔名修改下方的 src
