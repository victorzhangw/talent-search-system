# Nginx 基本配置 - 階段 1（只有 HTTP，用於測試）
# 檔案位置：C:\nginx\conf\nginx.conf

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 定義後端伺服器（Waitress）
    upstream waitress_backend {
        server 127.0.0.1:5000;
    }

    # HTTP Server
    server {
        listen       80;
        server_name  devzoneapi1.aurocore.com localhost;

        # 日誌檔案
        access_log  logs/access.log;
        error_log   logs/error.log;

        # 所有請求轉發到 Waitress
        location / {
            # 轉發到後端
            proxy_pass http://waitress_backend;
            
            # 基本 Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSE 串流關鍵設定
            proxy_buffering off;              # 禁用緩衝
            proxy_cache off;                  # 禁用快取
            proxy_http_version 1.1;           # 使用 HTTP/1.1
            proxy_set_header Connection "";   # 保持連線
            chunked_transfer_encoding on;     # 啟用分塊傳輸
            
            # 超時設定
            proxy_read_timeout 300s;          # 5 分鐘
            proxy_connect_timeout 75s;
        }
    }
}
