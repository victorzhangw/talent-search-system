<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traitty Chat API</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .status {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: rgba(76, 175, 80, 0.3);
            border-radius: 25px;
            margin-bottom: 2rem;
        }

        .links {
            margin-top: 2rem;
        }

        .links a {
            display: inline-block;
            margin: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .links a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🤖 Traitty Chat API</h1>
        <div class="status">✅ 服務運行中</div>
        <p>人才特質分析 API 服務</p>

        <div class="links">
            <a href="/api/v2/health">健康檢查</a>
            <a href="/api/v2/candidates/">候選人列表</a>
        </div>

        <p style="font-size: 0.9rem; margin-top: 2rem; opacity: 0.7;">
            Powered by Traitty AI
        </p>
    </div>
</body>

</html>
