version: '3.9'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_chatbot_v2}
      POSTGRES_USER: ${DB_USER:-projectuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-projectpass}
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-projectuser} -d ${DB_NAME:-ai_chatbot_v2}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.v2
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - BackEnd/api_v2/.env
    environment:
      # Override localhost DB host with compose service name
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_v2:
