version: 1
models:
  classifier_model:
    provider: openai_compatible
    name_env: LLM_INTENT_MODEL
    name_default_env: LLM_MODEL
    temperature: 0
    max_tokens: 200
    timeout_seconds: 20
    fallbacks: []

  answer_model:
    provider: openai_compatible
    name_env: LLM_CHAT_MODEL
    name_default_env: LLM_MODEL
    temperature: 0.4
    max_tokens: 700
    timeout_seconds: 30
    fallbacks: []
