id: talent_chat_v1
version: 1
# entry_start: called by /api/chat/start
entry_start: init
# entry_message: called by /api/chat/message
entry_message: on_message

nodes:
  init:
    type: state_init
    set:
      state: WAIT_USER
    next: greet

  greet:
    type: template
    prompt_ref: greet
    next: wait_user

  wait_user:
    type: wait_user

  on_message:
    type: moderation
    mode: input
    policy_ref: default_policy
    input: user_message
    next:
      ok: detect_intent
      blocked: end_refuse

  detect_intent:
    type: intent_router
    input: user_message
    next: route_by_intent

  route_by_intent:
    type: switch
    var: intent
    cases:
      compare: reply_compare
      interview: reply_interview
      search: reply_search
      list_all: reply_list_all
      list_traits: reply_list_traits
      statistics: reply_statistics
      advice: reply_advice
    default_next: reply_fallback

  reply_compare:
    type: template
    prompt_ref: reply_compare
    next: output_moderation

  reply_interview:
    type: template
    prompt_ref: reply_interview
    next: output_moderation

  reply_search:
    type: tool
    tool_name: talent_search
    input:
      raw_query: user_message
    next: compose_search_answer
    fallback_next: reply_search_fallback

  compose_search_answer:
    type: llm
    model_policy: answer_model
    system_ref: compose_with_tool_result_system
    user_ref: compose_with_tool_result_user
    next: output_moderation
    fallback_next: reply_search_fallback

  reply_search_fallback:
    type: template
    prompt_ref: reply_search
    next: output_moderation

  reply_list_all:
    type: template
    prompt_ref: reply_list_all
    next: output_moderation

  reply_list_traits:
    type: template
    prompt_ref: reply_list_traits
    next: output_moderation

  reply_statistics:
    type: template
    prompt_ref: reply_statistics
    next: output_moderation

  reply_advice:
    type: template
    prompt_ref: reply_advice
    next: output_moderation

  reply_fallback:
    type: template
    prompt_ref: reply_fallback
    next: output_moderation

  output_moderation:
    type: moderation
    mode: output
    policy_ref: default_policy
    input: assistant_message
    next:
      ok: wait_user
      blocked: end_safe

  end_refuse:
    type: end
    message_ref: end_refuse

  end_safe:
    type: end
    message_ref: end_safe
