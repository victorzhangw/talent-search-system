[project]
name = "talent-search-api-v2"
version = "0.1.0"
description = "API v2 for Talent Search System with RAG and DeepSeek"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "jinja2>=3.1.0",
    "sqlalchemy>=2.0.0",
    "pyjwt>=2.8.0"
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]
