# Nginx 配置 - 階段 2（HTTP + HTTPS，使用現有憑證）
# 檔案位置：C:\nginx\conf\nginx.conf

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 定義後端伺服器（Waitress）
    upstream waitress_backend {
        server 127.0.0.1:5000;
    }

    # HTTP Server - 重定向到 HTTPS
    server {
        listen       80;
        server_name  devzoneapi1.aurocore.com;

        # 重定向所有 HTTP 到 HTTPS
        return 301 https://$server_name$request_uri;
    }

    # HTTPS Server
    server {
        listen       443 ssl;
        server_name  devzoneapi1.aurocore.com;

        # SSL 憑證路徑（請替換為你的實際路徑）
        ssl_certificate      C:/path/to/your/certificate.crt;
        ssl_certificate_key  C:/path/to/your/private.key;

        # SSL 設定
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;

        # 日誌檔案
        access_log  logs/access.log;
        error_log   logs/error.log;

        # 所有請求轉發到 Waitress
        location / {
            # 轉發到後端
            proxy_pass http://waitress_backend;
            
            # 基本 Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSE 串流關鍵設定
            proxy_buffering off;              # 禁用緩衝
            proxy_cache off;                  # 禁用快取
            proxy_http_version 1.1;           # 使用 HTTP/1.1
            proxy_set_header Connection "";   # 保持連線
            chunked_transfer_encoding on;     # 啟用分塊傳輸
            
            # 超時設定
            proxy_read_timeout 300s;          # 5 分鐘
            proxy_connect_timeout 75s;
        }
    }
}
